buildscript {
    repositories {
        mavenCentral()
        jcenter()
        maven { url = "https://maven.minecraftforge.net" }
        maven { name = "sonatype"; url = "https://oss.sonatype.org/content/repositories/snapshots/" }
    }
    dependencies {
        classpath('com.anatawa12.forge:ForgeGradle:1.2-1.0.+') { changing = true }
    }
}

allprojects {
    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
}

// ------------------ VERSION INCREMENT ------------------
def versionFile = file('version.properties')
def currentVersion = '1.9.0' // default

if (versionFile.exists()) {
    currentVersion = versionFile.text.trim()
}

def versionParts = currentVersion.tokenize('.')
def patch = versionParts[2].toInteger() + 1
def newVersion = "${versionParts[0]}.${versionParts[1]}.${patch}"

version = newVersion

task updateVersion {
    doLast {
        versionFile.text = newVersion
        println "Version updated to $newVersion"
    }
}

afterEvaluate {
    build.dependsOn updateVersion
}

// ------------------ BASIC PROJECT SETUP ------------------
apply plugin: 'forge'
apply plugin: 'java'

group = "com.ragex.mchelio"
archivesBaseName = "mchelio"

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "build/run" // <--- important for IDE asset loading
}

repositories {
    maven { name = "chickenbones"; url = "http://chickenbones.net/maven/" }
}

dependencies {
    runtime "codechicken:CodeChickenLib:1.7.10-1.1.3.140:dev"
    runtime "codechicken:CodeChickenCore:1.7.10-1.0.7.47:dev"
    runtime "codechicken:NotEnoughItems:1.7.10-1.0.5.120:dev"
    compile fileTree(dir: 'lib', include: ['*.jar'])
}

compileJava {
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

// ------------------ RESOURCE PROCESSING ------------------
sourceSets {
    main {
        resources {
            srcDir 'src/main/resources'
            exclude 'assets/**'
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        exclude 'assets/**'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
        exclude 'assets/**'
    }
}

// ------------------ CODE-ONLY PACKAGING ------------------
// Use this task for release/code artifacts. It depends only on Java
// compilation and packages compiled class files without processing, scanning,
// copying, or including the root assets folder or any resource assets.
task buildcode(type: Jar, dependsOn: compileJava) {
    group = 'build'
    description = 'Builds a code-only jar from compiled classes without packaging assets or resources.'

    baseName = archivesBaseName
    version = project.version
    classifier = 'code'

    if (sourceSets.main.output.hasProperty('classesDirs')) {
        from sourceSets.main.output.classesDirs
    } else {
        from sourceSets.main.output.classesDir
    }

    include '**/*.class'
    exclude 'assets'
    exclude 'assets/**'
}

// Camel-case alias for users who naturally type Gradle task names this way.
task buildCode(dependsOn: buildcode) {
    group = 'build'
    description = 'Alias for buildcode.'
}

// ------------------ ASSETS COPY TASK ------------------
// Copies 'assets/' from project root to the run directory for IDE dev environment
task copyAssetsToRun(type: Copy) {
    from 'assets' // <-- your root assets folder
    into "$buildDir/run/assets" // copied to run folder
}

tasks.matching { it.name == 'reobfJar' }.all {
    if (it.metaClass.respondsTo(it, 'exclude', Object[])) {
        it.exclude 'assets'
        it.exclude 'assets/**'
    }
}

// ------------------ RUNCLIENT-ONLY ASSET SETUP ------------------
// Keep the IDE/dev runtime asset setup, but do not wire these tasks into
// processResources, jar, reobfJar, build, or any release packaging path.
task copyAssetsToRun(type: Copy) {
    onlyIf {
        file('assets').isDirectory()
    }

    from 'assets'
    into "$buildDir/run/assets"

    doFirst {
        println "[MCH] Copying root assets to run directory for runClient only"
        println "  from: ${file('assets')}"
        println "  into: ${file("$buildDir/run/assets")}"
    }
}

task syncMCHeliAssets(type: Copy) {
    def srcDir = file("$buildDir/run/mods/mcheli/assets/mcheli")
    def dstDir = file("${sourceSets.main.output.resourcesDir}/assets/mcheli")

    onlyIf {
        srcDir.isDirectory()
    }

    dependsOn processResources
    mustRunAfter processResources

    from(srcDir) {
        include "hud/**"
        include "models/**"
        include "shaders/**"
        include "sounds/**"
        include "textures/**"
        include "sounds.json"
    }

    dependsOn processResources
    mustRunAfter processResources

    from 'assets'
    into "${sourceSets.main.output.resourcesDir}/assets"

    doFirst {
        println "[MCH] Syncing runtime assets -> runClient resources"
        println "  from: $srcDir"
        println "  into: $dstDir"
    }
}

def configureRunClientAssets = { task ->
    task.dependsOn copyAssetsToRun
    task.dependsOn syncMCHeliAssets
}

tasks.matching { it.name == 'runClient' }.all configureRunClientAssets
tasks.whenTaskAdded { task ->
    if (task.name == 'runClient') {
        configureRunClientAssets(task)
    }
}

clean.doLast {
    delete "$buildDir/run/assets"
    delete "${sourceSets.main.output.resourcesDir}/assets"
}
