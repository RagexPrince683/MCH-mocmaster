# Human-readable mod name, available for mcmod.info population.
modName = MC Helicopter Overdrive+
modVersion = 1.0.0

# Case-sensitive identifier string, available for mcmod.info population.
modId = mcheli

# Root package of the mod.
modGroup = mcheli

# Whether to use modGroup as the maven publishing group.
useModGroupForPublishing = true

# Don't auto-update build scripts
autoUpdateBuildScript = false

# Minecraft / Forge targeting
minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614
channel = stable
mappingsVersion = 12
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/

# Development
developmentEnvironmentUserName = Developer
enableModernJavaSyntax = true
enableGenericInjection = false

# Version token generation
generateGradleTokenClass = com.ragex.mchelio.Tags
gradleTokenVersion = VERSION
replaceGradleTokenInFile =

# Access transformers (none currently)
accessTransformersFile =

# Mixins (not used)
usesMixins = false
separateMixinSourceSet =
usesMixinDebug = false
mixinPlugin =
mixinsPackage =

# Coremod (not used)
coreModClass =
containsMixinsAndOrCoreModOnly = false
forceEnableMixins = false

# Shadowing (not used for now)
usesShadowedDependencies = false
minimizeShadowedDependencies = true
relocateShadowedDependencies = true

# Repositories
includeWellKnownRepositories = true
excludeWellKnownRepositories =

# Publishing
usesMavenPublishing = false
modrinthProjectId =
modrinthRelations =
curseForgeProjectId =
curseForgeRelations =

# Code quality
disableSpotless = true
disableCheckstyle = true

# Gradle settings
org.gradle.java.home = /usr/lib/jvm/java-25-openjdk
org.gradle.configuration-cache = true
org.gradle.parallel = true
